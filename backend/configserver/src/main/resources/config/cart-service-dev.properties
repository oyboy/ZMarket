spring.datasource.url=jdbc:postgresql://localhost:5432/cartsdb
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=false
spring.jpa.hibernate.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.hibernate.properties.hibernate.cache.use_query_cache=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

resilience.rate-limiter.limit-for-period=300
resilience.rate-limiter.limit-refresh-period=1s
resilience.rate-limiter.timeout-duration=0

resilience.bulkhead.max-concurrent-calls=100
resilience.bulkhead.max-wait-duration=100ms

resilience.circuit-breaker.failure-rate-threshold=50
resilience.circuit-breaker.slow-call-rate-threshold=50
resilience.circuit-breaker.slow-call-duration-threshold=2s
resilience.circuit-breaker.sliding-window-size=100
resilience.circuit-breaker.minimum-number-of-calls=30
resilience.circuit-breaker.permitted-number-of-calls-in-half-open-state=10
resilience.circuit-breaker.wait-duration-in-open-state=30s

resilience.time-limiter.timeout-duration=2s

resilience.retry.max-attempts=2
resilience.retry.wait-duration=200ms
resilience.retry.enable-exponential-backoff=true
resilience.retry.backoff-multiplier=2.0