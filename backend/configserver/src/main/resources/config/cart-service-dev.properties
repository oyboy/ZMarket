spring.datasource.url=jdbc:postgresql://localhost:5432/cartsdb
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=false
spring.jpa.hibernate.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.hibernate.properties.hibernate.cache.use_query_cache=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

management.endpoints.web.exposure.include=metrics,health
management.metrics.enable.cache=true
management.metrics.distribution.percentiles-histogram.cache.gets=true
management.metrics.tags.cache.name=*