spring.cloud.loadbalancer.ribbon.enabled = false

management.endpoints.web.exposure.include=*

eureka.instance.preferIpAddress = true
eureka.client.registerWithEureka = true
eureka.client.fetchRegistry = true
eureka.client.serviceUrl.defaultZone = http://localhost:8070/eureka/

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085/realms/master
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8085/realms/master/protocol/openid-connect/certs