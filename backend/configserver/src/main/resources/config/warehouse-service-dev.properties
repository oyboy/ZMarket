spring.datasource.url=jdbc:postgresql://localhost:5432/warehousedb
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=false
spring.jpa.hibernate.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.hibernate.properties.hibernate.cache.use_query_cache=false

spring.kafka.consumer.group-id=warehouse-service-group

resilience.rate-limiter.limit-for-period=200
resilience.rate-limiter.limit-refresh-period=1s
resilience.rate-limiter.timeout-duration=0

resilience.bulkhead.max-concurrent-calls=50
resilience.bulkhead.max-wait-duration=50ms

resilience.circuit-breaker.failure-rate-threshold=50
resilience.circuit-breaker.slow-call-rate-threshold=50
resilience.circuit-breaker.slow-call-duration-threshold=1s
resilience.circuit-breaker.sliding-window-size=50
resilience.circuit-breaker.minimum-number-of-calls=20
resilience.circuit-breaker.permitted-number-of-calls-in-half-open-state=5
resilience.circuit-breaker.wait-duration-in-open-state=20s

resilience.time-limiter.timeout-duration=1s

resilience.retry.max-attempts=1
resilience.retry.wait-duration=200ms
resilience.retry.enable-exponential-backoff=false