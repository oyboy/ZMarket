spring.datasource.url = jdbc:postgresql://localhost:5432/productsdb
spring.datasource.username = postgres
spring.datasource.password = root

spring.data.redis.host=localhost
spring.data.redis.port=6379

management.endpoints.web.exposure.include=metrics,health
management.metrics.enable.cache=true
management.metrics.distribution.percentiles-histogram.cache.gets=true
management.metrics.tags.cache.name=*

spring.data.mongodb.uri=mongodb://localhost:27017/productsdb
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=product-service-group-v2
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false