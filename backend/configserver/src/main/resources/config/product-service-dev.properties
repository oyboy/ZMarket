spring.datasource.url = jdbc:postgresql://localhost:5432/productsdb
spring.datasource.username = postgres
spring.datasource.password = root

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.consumer.group-id=product-service-group-v2

resilience.rate-limiter.limit-for-period=1000
resilience.rate-limiter.limit-refresh-period=1s
resilience.rate-limiter.timeout-duration=0

resilience.bulkhead.max-concurrent-calls=300
resilience.bulkhead.max-wait-duration=100ms

resilience.circuit-breaker.failure-rate-threshold=50
resilience.circuit-breaker.slow-call-rate-threshold=50
resilience.circuit-breaker.slow-call-duration-threshold=2s
resilience.circuit-breaker.sliding-window-size=200
resilience.circuit-breaker.minimum-number-of-calls=50
resilience.circuit-breaker.permitted-number-of-calls-in-half-open-state=20
resilience.circuit-breaker.wait-duration-in-open-state=30s

resilience.time-limiter.timeout-duration=2s

resilience.retry.max-attempts=3
resilience.retry.wait-duration=200ms
resilience.retry.enable-exponential-backoff=true
resilience.retry.backoff-multiplier=2.0

minio.url=http://localhost:9000
minio.external-url=http://localhost:9000
minio.access-key={minio.access-key}
minio.secret-key={minio.secret-key}
minio.bucket-name=productservice