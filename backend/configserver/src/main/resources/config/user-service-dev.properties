spring.datasource.url=jdbc:postgresql://localhost:5432/usersdb
spring.datasource.username=postgres
spring.datasource.password=root

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=false
spring.jpa.hibernate.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.hibernate.properties.hibernate.cache.use_query_cache=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

keycloak.server-url=http://localhost:8074
keycloak.realm=master
keycloak.client-id=${oauth2.client-id}
keycloak.client-secret=${oauth2.client-secret}

minio.url=http://localhost:9000
minio.external-url=http://localhost:9000
minio.access-key={minio.access-key}
minio.secret-key={minio.secret-key}
minio.bucket-name=userservice

resilience.circuit-breaker.failure-rate-threshold=50
resilience.circuit-breaker.slow-call-rate-threshold=50
resilience.circuit-breaker.slow-call-duration-threshold=2s
resilience.circuit-breaker.sliding-window-size=20
resilience.circuit-breaker.minimum-number-of-calls=10
resilience.circuit-breaker.permitted-number-of-calls-in-half-open-state=5
resilience.circuit-breaker.wait-duration-in-open-state=10s

resilience.bulkhead.max-concurrent-calls=5
resilience.bulkhead.max-wait-duration=50ms

resilience.rate-limiter.limit-for-period=10
resilience.rate-limiter.limit-refresh-period=1s
resilience.rate-limiter.timeout-duration=0
resilience.retry.max-attempts=2
resilience.retry.wait-duration=200ms
resilience.retry.enable-exponential-backoff=false