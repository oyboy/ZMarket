spring.datasource.url=jdbc:postgresql://localhost:5432/ordersdb
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=false
spring.jpa.hibernate.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.hibernate.properties.hibernate.cache.use_query_cache=false

resilience.bulkhead.max-concurrent-calls=3
resilience.bulkhead.max-wait-duration=0ms

resilience.time-limiter.timeout-duration=500ms

resilience.circuit-breaker.failure-rate-threshold=50
resilience.circuit-breaker.slow-call-rate-threshold=50
resilience.circuit-breaker.slow-call-duration-threshold=500ms
resilience.circuit-breaker.sliding-window-size=20
resilience.circuit-breaker.minimum-number-of-calls=10
resilience.circuit-breaker.permitted-number-of-calls-in-half-open-state=5
resilience.circuit-breaker.wait-duration-in-open-state=10s

resilience.rate-limiter.limit-for-period=1000
resilience.rate-limiter.limit-refresh-period=1s
resilience.rate-limiter.timeout-duration=0

resilience.retry.max-attempts=1
resilience.retry.wait-duration=200ms
resilience.retry.enable-exponential-backoff=false