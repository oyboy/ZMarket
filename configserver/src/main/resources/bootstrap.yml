spring:
  application:
    name: config-server
  profiles:
    active: native, vault
  cloud:
    config:
      server:
        vault:
          host: localhost
          port: 8200
          token: ${VAULT_TOKEN}
          kv-version: 2
          backend: kv
        native:
          search-locations: classpath:/config


server:
  port: 8071

management:
  endpoints:
    web:
      exposure:
        include: "*"
